name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Windows and Linux download
        shell: pwsh
        run: ./package.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/qq-aibot.zip" "dist/qq-aibot-windows.zip" --title "QQ AI Bot ${{ github.ref_name }}" --generate-notes --verify-tag
